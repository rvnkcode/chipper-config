# keymap-drawer config for the keymap drawing (read by .github/workflows/draw-keymap.yml).
# Only raw_binding_map is set: setting zmk_keycode_map would replace keymap-drawer's
# default symbol map instead of extending it.
parse_config:
  raw_binding_map:
    # Modifiers: same short names as the Korean layer (keymap-drawer/chipper_korean.yaml)
    "&kp LGUI": GUI
    "&kp LALT": ALT
    "&kp LCTRL": CTRL
    "&kp LSHFT": SHIFT
    "&hml LALT A": {t: A, h: ALT}
    "&hml LGUI R": {t: R, h: GUI}
    "&hml LCTRL S": {t: S, h: CTRL}
    "&hml LSHFT T": {t: T, h: SHIFT}
    "&hmr RSHFT N": {t: N, h: SHIFT}
    "&hmr LCTRL E": {t: E, h: CTRL}
    "&hmr RGUI I": {t: I, h: GUI}
    "&hmr LALT O": {t: O, h: ALT}
    # Clipboard keys. keymap-drawer runs these keys through the keymap's preprocessor,
    # so the U_* macros from chipper.keymap work here.
    U_UND: UNDO
    U_CUT: CUT
    U_CPY: COPY
    U_PST: PASTE
    U_RDO: REDO
    # Custom behaviors
    "&han_tog": HAN
    "&caps_word": CAPW
    "&kp CAPS": CAPS
    "&td_boot": {t: BOOT, h: x2}
    # Mouse keys
    "&mkp LCLK": LCLK
    "&mkp RCLK": RCLK
    "&mkp MCLK": MCLK
    "&mmv MOVE_LEFT": MS_L
    "&mmv MOVE_DOWN": MS_D
    "&mmv MOVE_UP": MS_U
    "&mmv MOVE_RIGHT": MS_R
    "&msc SCRL_LEFT": WH_L
    "&msc SCRL_DOWN": WH_D
    "&msc SCRL_UP": WH_U
    "&msc SCRL_RIGHT": WH_R
    "&mo ACCEL": ACCEL
    # Same names as the layer comments in chipper.keymap
    "&kp PAUSE_BREAK": PAUS
    "&kp PSCRN": PSCR
    "&kp PG_DN": PGDN
    "&kp PG_UP": PGUP
    "&kp C_PP": PLAY
    # Media layer: mode toggles, output and Bluetooth profiles
    "&tog MAC": {t: MAC, h: toggle}
    "&tog KOR": {t: KOR, h: toggle}
    "&out OUT_TOG": OUT
    "&bt BT_CLR": BTCLR
    "&bt BT_SEL 0": BT0
    "&bt BT_SEL 1": BT1
    "&bt BT_SEL 2": BT2
    "&bt BT_SEL 3": BT3
    "&bt BT_SEL 4": BT4
